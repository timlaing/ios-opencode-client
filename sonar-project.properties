sonar.projectKey=timlaing_ios-opencode-client
sonar.organization=timlaing
sonar.projectName=OpenCode Client for iOS
sonar.host.url=https://sonarcloud.io
sonar.sources=.github/scripts,OpenCodeRemote/OpenCodeRemote,Packages/OpenCodeKit/Sources,mock,scripts,plugins/opencode-push-relay/src
sonar.tests=OpenCodeRemote/OpenCodeRemoteTests,OpenCodeRemote/OpenCodeRemoteUITests,Packages/OpenCodeKit/Tests,tests,plugins/opencode-push-relay/tests,.github/scripts,scripts/ci/tests
sonar.exclusions=**/.build/**,**/dist/**,**/node_modules/**,**/*.xcassets/**,scripts/ci/tests/**
sonar.test.inclusions=**/*Tests.swift,**/test_*.py,**/*.test.*,**/tests/**
sonar.python.version=3.11,3.14
sonar.python.coverage.reportPaths=coverage/coverage-python.xml
sonar.javascript.lcov.reportPaths=coverage/coverage.lcov,coverage/coverage-classifier.lcov,coverage/coverage-bridge.lcov
sonar.coverageReportPaths=reports/coverage.xml
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
