# XcodeGen spec — source of truth for OpenCodeRemote.xcodeproj.
# Run `xcodegen generate` in this directory after editing; never hand-edit the pbxproj.
name: OpenCodeRemote
options:
  bundleIdPrefix: uk.co.laingcorp.opencode-client
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 4C8FWEBR8F
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0" # language mode 5 on the Swift 6.x compiler; revisit for Swift 6 strict concurrency
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: "NO"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
packages:
  OpenCodeKit:
    path: ../Packages/OpenCodeKit
targets:
  OpenCodeRemote:
    type: application
    platform: iOS
    sources:
      - path: OpenCodeRemote
        excludes:
          - Info.plist
    # A real Info.plist (not generated) so the nested ATS dictionary can be
    # expressed. NSAllowsLocalNetworking permits plain HTTP to loopback/LAN
    # hosts only, so the reference mock (127.0.0.1) is reachable in
    # development; production hosts use HTTPS under the documented trust
    # policy (docs/implementation-defaults.md).
    info:
      path: OpenCodeRemote/Info.plist
      properties:
        CFBundleDisplayName: OpenCode Client
        # Declared explicitly (not left to defaults): the UI suite runs
        # portrait AND landscape on both device families, and an
        # unsupported orientation would silently revert the rotation
        # under test. iPad carries all four as standard.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Scan the pairing QR code printed by opencode pair, and take photos to attach to your messages.
        # iOS 14+ local-network privacy: without this key a pairing attempt
        # at a LAN host can fail with NO prompt and no recovery path — the
        # ATS exception below permits the connection but does not grant the
        # privacy access. App plist only; extensions are exempt.
        NSLocalNetworkUsageDescription: Connect to your self-hosted OpenCode server on your local network.
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # W17 I6: the opt-in iCloud key-value sync (S19) needs the
    # ubiquity-kvstore entitlement on the signed app. Without it a
    # device build keeps NSUbiquitousKeyValueStore values in a local
    # store and never uploads, so S19 would report "Up to Date" while
    # nothing syncs (review W17 r7). Automatic signing folds this into
    # the profile. The LocalPushProvider extension stays entitlement-free
    # (app-push-provider pending Apple approval) — do not add its file
    # until then.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.laingcorp.opencode-client.OpenCodeRemote
        CODE_SIGN_ENTITLEMENTS: OpenCodeRemote.entitlements
    dependencies:
      - target: LocalPushProvider
        embed: true
      - package: OpenCodeKit
        product: OpenCodeDomain
      - package: OpenCodeKit
        product: OpenCodeStorage
      - package: OpenCodeKit
        product: OpenCodeTransport
  LocalPushProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: LocalPushProvider
        excludes:
          - Info.plist
    info:
      path: LocalPushProvider/Info.plist
      properties:
        CFBundleDisplayName: LocalPushProvider
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.app-push
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).OpenCodePushProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.laingcorp.opencode-client.OpenCodeRemote.LocalPushProvider
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
    dependencies:
      - package: OpenCodeKit
        product: OpenCodeTransport
      - package: OpenCodeKit
        product: OpenCodeDomain
      - package: OpenCodeKit
        product: OpenCodeStorage
  OpenCodeRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenCodeRemoteTests
    # The package products below are ALSO linked by the host app.
    # Verified there is no duplicated library code in the test process:
    # the build log carries no ld duplication warning, and the suite
    # depends on cross-boundary casts working — a TransportError thrown
    # by a test-bundle stub, caught and classified in app code (e.g.
    # refresh 401 -> .reauthRequired, envelope messages in error text),
    # which duplicated type metadata would silently break.
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: OpenCodeRemote
      - package: OpenCodeKit
        product: OpenCodeDomain
      - package: OpenCodeKit
        product: OpenCodeStorage
      - package: OpenCodeKit
        product: OpenCodeTransport
  OpenCodeRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OpenCodeRemoteUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: OpenCodeRemote
    dependencies:
      - target: OpenCodeRemote
schemes:
  OpenCodeRemote:
    build:
      targets:
        OpenCodeRemote: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OpenCodeRemoteTests
        - OpenCodeRemoteUITests # root shell on iPhone + iPad, portrait + landscape
        # OpenCodeKitTests (package) runs via `swift test --package-path ../Packages/OpenCodeKit`
