name-template: "Plugin v$RESOLVED_VERSION"
tag-template: "plugin-v$RESOLVED_VERSION"
commitish: main
tag-prefix: plugin-v
filter-by-commitish: true
include-labels: ["component: push-relay"]
categories:
  - title: Dependencies
    labels: [dependencies]
  - title: Fixes
    labels: [bug, bugfix]
  - title: Features
    labels: [enhancement]
  - title: Push-relay plugin
    labels: ["component: push-relay"]
  - title: Documentation
    labels: ["component: documentation"]
  - title: Contracts and maintenance
    labels: ["component: mock-contracts", "component: ci"]
version-resolver:
  major:
    labels: [breaking-change]
  minor:
    labels: [enhancement]
  patch:
    labels: [bug, dependencies]
  default: patch
change-title-escapes: '\<*_&`'
template: |
  ## Changes

  $CHANGES

  ## Contributors

  $CONTRIBUTORS
