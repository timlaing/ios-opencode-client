name: Bug report
description: Report a bug with OpenCode Client for iOS
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Before opening an issue,
        please search the
        [existing issues](https://github.com/timlaing/ios-opencode-client/issues?q=is%3Aissue)
        and check that you are running the
        [latest release](https://github.com/timlaing/ios-opencode-client/releases).
  - type: dropdown
    id: components
    attributes:
      label: Affected component
      description: Select all affected components, or choose Unknown.
      multiple: true
      options:
        - "component: app"
        - "component: transport"
        - "component: domain"
        - "component: storage"
        - "component: mock-contracts"
        - "component: push-relay"
        - "component: ci"
        - "component: documentation"
        - Unknown
    validations:
      required: true
  - type: textarea
    attributes:
      label: The problem
      description: Describe the issue you are experiencing. Tell us what you were trying to do and what happened instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Provide details about the versions you are using, which helps us to reproduce and find the issue quickly.
      placeholder: |
        - App build / plugin version:
        - OpenCode server version:
        - Device and iOS/iPadOS version (or host OS/Node for plugin reports):
        - Physical device or simulator:
        - Real OpenCode host or reference mock:
        - Last working version, if known:
      render: markdown
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behaviour.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Traceback / error logs
      description: Optional. Remove passwords, pairing tokens, host addresses and private conversation content before sharing logs or screenshots.
      render: shell
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I have read the README and searched the existing issues.
          required: true
        - label: I have checked the latest release to see whether the issue is already fixed.
          required: true
        - label: This issue contains a single problem report only.
          required: true
  - type: textarea
    attributes:
      label: Additional information
      description: Anything else that might help, such as configuration samples or reproduction notes.
