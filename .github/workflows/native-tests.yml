name: Native tests and SonarQube
on:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    name: CI integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.12.0"
      - name: Test API bridge with coverage
        run: |
          mkdir -p reports
          node --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=reports/coverage-bridge.lcov scripts/ci/tests/*.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-bridge
          path: reports/coverage-bridge.lcov
          if-no-files-found: error
          retention-days: 7
      - run: python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py' -v

  native:
    name: Native iOS tests
    # Fork PRs never execute on the self-hosted macOS runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, xcode, xcode-27]
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select expected revision
        id: revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
      - name: Select iPhone simulator
        env:
          DEVICE_FAMILY: iPhone
        run: python3 scripts/ci/select_simulator.py
      - name: Run app unit and UI tests on iPhone
        run: |
          set -euo pipefail
          mkdir -p reports/cloud
          rm -rf reports/cloud/TestResults-iPhone.xcresult
          xcodebuild test \
            -project OpenCodeRemote/OpenCodeRemote.xcodeproj \
            -scheme OpenCodeRemote \
            -destination "id=$SIMULATOR_ID" \
            -enableCodeCoverage YES \
            -resultBundlePath reports/cloud/TestResults-iPhone.xcresult
      - name: Select iPad simulator
        env:
          DEVICE_FAMILY: iPad
        run: python3 scripts/ci/select_simulator.py
      - name: Run app unit and UI tests on iPad
        run: |
          set -euo pipefail
          rm -rf reports/cloud/TestResults-iPad.xcresult
          xcodebuild test \
            -project OpenCodeRemote/OpenCodeRemote.xcodeproj \
            -scheme OpenCodeRemote \
            -destination "id=$SIMULATOR_ID" \
            -enableCodeCoverage YES \
            -resultBundlePath reports/cloud/TestResults-iPad.xcresult
      - name: Package result bundles for the coverage stage
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cd reports/cloud
          zip -qry result-1.zip TestResults-iPhone.xcresult
          zip -qry result-2.zip TestResults-iPad.xcresult
          python3 - "$HEAD_SHA" "$BASE_SHA" <<'PY'
          import json
          import sys
          bundle = {
              'status': 'SUCCEEDED',
              'sha': sys.argv[1],
              'baseSha': sys.argv[2],
              'artifacts': [{'file': 'result-1.zip'}, {'file': 'result-2.zip'}],
          }
          with open('build.json', 'w') as stream:
              json.dump(bundle, stream)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: xcode-results
          path: reports/cloud/
          if-no-files-found: ignore
          retention-days: 7
      - name: Analyze app sources
        run: |
          xcodebuild analyze \
            -project OpenCodeRemote/OpenCodeRemote.xcodeproj \
            -scheme OpenCodeRemote \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  sonar:
    name: Coverage and SonarQube quality gate
    needs: [validate, native]
    runs-on: [self-hosted, macOS, ARM64, xcode, xcode-27]
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # PR builds use the same source/base merge tree tested natively.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download native result bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: xcode-results
          path: reports/cloud
      - name: Download Python and plugin coverage from Tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
      - name: Run package tests with coverage
        run: |
          swift test --package-path Packages/OpenCodeKit --enable-code-coverage --force-resolved-versions
          coverage_path="$(swift test --package-path Packages/OpenCodeKit --show-codecov-path)"
          cp "$coverage_path" reports/package-coverage.json
      - name: Convert and merge line coverage
        run: |
          python3 scripts/ci/coverage.py --cloud reports/cloud --llvm reports/package-coverage.json --output reports/coverage.xml
      - name: Configure SonarQube project and revision
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'timlaing_ios-opencode-client' }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          EXPECTED_SHA: ${{ needs.native.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          BRANCH: ${{ github.ref_name }}
        run: python3 scripts/ci/sonar_config.py
      - name: SonarQube scan and quality gate
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      - name: Save coverage and analysis metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: swift-coverage
          path: |
            reports/coverage.xml
            reports/package-coverage.json
            reports/cloud/build.json
            .scannerwork/report-task.txt
          if-no-files-found: ignore
          retention-days: 14

  required:
    name: Required CI
    if: always()
    needs: [validate, native, sonar]
    runs-on: ubuntu-latest
    steps:
      - name: Require every stage to succeed
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
        run: |
          if [ "$VALIDATE_RESULT" != success ] || [ "$NATIVE_RESULT" != success ] || [ "$SONAR_RESULT" != success ]; then
            echo 'CI incomplete: integration tests, native iOS tests and SonarQube must all succeed.'
            exit 1
          fi
