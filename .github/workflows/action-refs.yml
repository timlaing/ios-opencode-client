name: Workflow validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache: false
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: actionlint
      - run: python3 scripts/check_action_refs.py .github/workflows
      - run: node --test .github/scripts/*.test.cjs
      - run: python3 -m unittest discover -s scripts/ci/tests -v
