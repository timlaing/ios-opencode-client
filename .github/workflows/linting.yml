name: Lint and documentation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - run: python3 scripts/ci/check_repository.py
      - name: Compile Python sources without adding runtime dependencies
        run: python3 -m compileall -q mock scripts tests
      - name: Check changed Markdown and YAML formatting
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.12.0"
      - run: npx --yes prettier@3.6.2 --check '.github/**/*.{yml,yaml,json,md,cjs}' SECURITY.md
