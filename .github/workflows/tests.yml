name: Tests
on:
  push:
    branches: [main, integration, opencode-plugin]
  pull_request:
  workflow_dispatch:
    inputs:
      cloud_run_id:
        description: Optional Cloud run ID matching this branch commit
        required: false
        type: string
      wait_seconds:
        description: Optional Xcode Cloud wait in seconds (capped at 4800)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s tests -v
      - name: Verify generated files are reproducible
        run: |
          python3 -m mock.fixtures
          python3 scripts/build_contracts.py
          git diff --exit-code -- fixtures/generated contracts docs/api-route-catalog.md
      - name: Measure coverage (CI tool only, mock remains dependency-free)
        if: matrix.python == '3.14'
        run: |
          python3 -m pip install coverage==7.11.0
          python3 -m coverage run --branch --source=mock,scripts -m unittest discover -s tests
          python3 -m coverage run --append --branch --source=mock,scripts -m unittest discover -s scripts/ci/tests
          python3 -m coverage xml -o coverage-python.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.python == '3.14'
        with:
          name: coverage-python
          path: coverage-python.xml
          if-no-files-found: error
          retention-days: 7
  plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/opencode-push-relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.12.0"
          cache: npm
          cache-dependency-path: plugins/opencode-push-relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=coverage.lcov tests/
      - name: Normalize coverage source paths
        run: sed -i 's|^SF:|SF:plugins/opencode-push-relay/|' coverage.lcov
      - name: Test repository classifier with coverage
        working-directory: .
        run: node --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=coverage-classifier.lcov .github/scripts/*.test.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-classifier
          path: coverage-classifier.lcov
          if-no-files-found: error
          retention-days: 7
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-plugin
          path: plugins/opencode-push-relay/coverage.lcov
          if-no-files-found: error
          retention-days: 7
  native:
    name: Native Cloud and SonarQube
    needs: [python, plugin]
    uses: ./.github/workflows/xcode-cloud.yml
    secrets: inherit
    with:
      cloud_run_id: ${{ inputs.cloud_run_id || '' }}
      wait_seconds: ${{ inputs.wait_seconds || '' }}
